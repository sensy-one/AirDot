setup_page:
  html_title: Set up AirDot
  hero_title: Set up AirDot
  hero_body: Set up your connection, time, display, and integrations.

  saved: Settings saved

  network_title: Connection
  network_note: Choose a Wi-Fi network or use AirDot without Wi-Fi.
  wifi_ssid_label: Wi-Fi network
  wifi_password_label: Wi-Fi password
  wifi_password_placeholder: Enter password
  password_visibility_toggle_label: Show or hide password
  offline_option: Continue without Wi-Fi
  no_networks: No Wi-Fi networks found

  integrations_title: Integrations
  integrations_note: Connect AirDot to Home Assistant, Homey Pro or an MQTT server.

  ha_discovery_title: Home Assistant & Homey Pro
  ha_discovery_description: Make AirDot automatically discoverable in Home Assistant and Homey Pro.

  mqtt_title: MQTT
  mqtt_description: Send measurement data to an MQTT server.
