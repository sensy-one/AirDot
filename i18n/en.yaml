onboarding:
  setup_language:
    title: Choose language
    body: |-
      Press briefly to switch.
      Hold to confirm.
  setup_connect:
    title: Set up AirDot
    body: |-
      Open Wi-Fi on your phone
      and choose AirDot-XXXXXX.

      Then open your browser
      and go to 192.168.4.1
    button_0: Later
    button_0_reopen: Back

  setup_applying:
    title: Connecting
    body: |-
      AirDot is applying your settings
      and connecting.
    button_0: Please wait…

  setup_complete:
