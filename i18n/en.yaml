  mqtt_port_label: Port
  mqtt_username_label: Username
  mqtt_password_label: Password
  mqtt_topic_prefix_label: Topic prefix
  optional_placeholder: Optional
  air_quality_title: Air quality
  air_quality_note: Choose the guideline AirDot uses to assess air quality.
  air_quality_profile_label: Guideline
  custom_thresholds_title: Custom thresholds
  custom_thresholds_description: Use your own limits instead of the selected guideline.
  custom_thresholds_note: Set the upper limit for each status. Values above Unhealthy are Critical. Limits must increase from left to right.
  custom_thresholds_order_error: The four limits must increase from left to right.
  custom_threshold_balanced_label: Good
  custom_threshold_moderate_label: Moderate
  custom_threshold_poor_label: Poor
  custom_threshold_unhealthy_label: Unhealthy

  sensor_calibration_title: Sensor calibration
  sensor_calibration_note: "Adjust the built-in temperature and humidity readings."
  sen66_temperature_offset_label: SEN66 reads high by
  sen66_humidity_offset_label: "SEN66 humidity reads high by"
  sen66_co2_reference_label: CO2 baseline
  sen66_co2_calibration_title: Force CO2 baseline calibration
  sen66_co2_calibration_description: Place AirDot in fresh outdoor air for at least 3 minutes, then save.
  sen66_voc_learning_time_label: VOC baseline learning time
  sen66_learning_time_help: Hours (1-1000). Use longer times for rooms that are often empty.

  alerts_title: Alerts
  alerts_note: Set when AirDot should alert you.
  alert_snooze_label: Snooze duration
  alert_snooze_description: Minutes (0–60). Pause air-quality alert sound, focus and screen wake. 0 disables snooze.

  display_alert_wake_screen_title: Wake screen
  display_alert_wake_screen_description: Turn on the display for Home Assistant alerts and critical air-quality readings.

  audio_alerts_title: Sound alerts
  audio_alerts_description: Play a warning tone when a measurement reaches a critical level.

  hazard_focus_title: Focus on critical values
  hazard_focus_description: Automatically show the chart for the sensor with the highest risk level.

  firmware_title: Firmware update
  firmware_note: Select an OTA .bin file for the AirDot firmware update.
  firmware_file_label: Firmware file
  firmware_select_button: Choose firmware file
  firmware_upload_button: Update firmware
  firmware_success: Update successful
  firmware_no_file: Select a firmware file first
  firmware_failed: Update failed

  time_title: Time
  time_note: Set date, time, and time format.

  time_server_title: Date and time
  time_server_description: Let AirDot update the time automatically or set date and time yourself.
