select:
  - platform: template
    id: ha_display_page
    name: Display Page
    internal: false
    icon: mdi:monitor-dashboard
    update_interval: 1s
    options:
      - Overview
      - Time and Weather
      - Flight Radar
      - PM1
      - PM2.5
      - PM4
      - PM10
      - CO2
      - VOC
      - NOx
      - Temperature
      - Humidity
      - Pressure
      - Light
    lambda: |-
      esphome::lvgl::LvPageType *const pages[] = {
        id(air_quality_summary_page), id(time_page), id(flight_radar_page),
        id(pm1_history_page), id(pm25_history_page), id(pm4_history_page), id(pm10_history_page),
        id(co2_history_page), id(voc_history_page), id(nox_history_page),
        id(temp_history_page), id(hum_history_page), id(pressure_history_page), id(lux_history_page)
      };
      for (size_t index = 0; index < sizeof(pages) / sizeof(pages[0]); index++) {
        if (pages[index] != nullptr && pages[index]->is_showing()) {
          const auto current = id(ha_display_page).active_index();
          if (current.has_value() && *current == index)
            return {};
          return std::string(id(ha_display_page).option_at(index));
        }
      }
      return {};
    set_action:
      - lambda: |-
          const auto requested = id(ha_display_page).index_of(x.c_str());
          if (!requested.has_value())
            return;
          if (AirDot::onboarding::setup_or_onboarding_active(
                id(setup_ap_active), id(setup_portal_active), id(onboarding_ui_active)) ||
              id(ui_alert_active) != 0 ||
              id(air_quality_hazard_focus_hazard_since_ms) != 0 ||
              id(air_quality_hazard_focus_metric) != -1 ||
              id(air_quality_hazard_focus_clear_since_ms) != 0 ||
              id(air_quality_hazard_focus_status_since_ms) != 0) {
            return;
          }

          if (*requested == 1) {
            const bool manual_time_available = AirDot::onboarding::load_manual_time_enabled() &&
                id(sntp_time).utcnow().is_valid();
            const bool online_time_available = AirDot::onboarding::has_saved_wifi_settings() &&
                (AirDot::onboarding::load_time_server_enabled() || AirDot::onboarding::load_weather_enabled());
            if (!manual_time_available && !online_time_available)
              return;
          }
          if (*requested == 2 &&
              (!AirDot::onboarding::has_saved_wifi_settings() || !AirDot::onboarding::load_flight_radar_enabled())) {
            return;
          }

          esphome::lvgl::LvPageType *const pages[] = {
            id(air_quality_summary_page), id(time_page), id(flight_radar_page),
            id(pm1_history_page), id(pm25_history_page), id(pm4_history_page), id(pm10_history_page),
            id(co2_history_page), id(voc_history_page), id(nox_history_page),
            id(temp_history_page), id(hum_history_page), id(pressure_history_page), id(lux_history_page)
          };
          if (*requested >= sizeof(pages) / sizeof(pages[0]) || pages[*requested] == nullptr)
            return;
          auto *page = pages[*requested];
          page->get_parent()->show_page(page->index, LV_SCREEN_LOAD_ANIM_NONE, 0);
          id(ui_auto_page_switch_last_ms) = millis();
          if (*requested == 2) {
            const uint32_t request_at_ms = millis() + 300UL;
            if (id(flight_radar_next_request_ms) == 0 ||
                static_cast<int32_t>(millis() - id(flight_radar_next_request_ms)) >= 0) {
              id(flight_radar_next_request_ms) = request_at_ms;
            }
            id(flight_radar_request_update_after_page_show).execute();
          }
      - component.update: ha_display_page
      - lambda: |-
          const auto current = id(ha_display_page).active_index();
          if (current.has_value())
            id(ha_display_page).publish_state(*current);
