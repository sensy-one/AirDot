api:
  id: home_assistant_api
  reboot_timeout: 0s
  actions:
    - action: show_display_alert
      variables:
        title: string
        message: string
        duration_seconds: int
        sound_enabled: bool
        text_color: string
      then:
        - if:
            condition:
              lambda: "return !AirDot::onboarding::setup_or_onboarding_active(id(setup_ap_active), id(setup_portal_active), id(onboarding_ui_active));"
            then:
              - script.execute: ui_stop_display_alert_sound
              - lambda: |-
                  id(ui_alert_title) = AirDot::sanitize_alert_text(title, 64);
                  id(ui_alert_message) = AirDot::sanitize_alert_text(message, 240);

                  uint32_t parsed_color = 0xFFFFFF;
                  if (AirDot::parse_display_color(text_color, parsed_color)) {
                    id(ui_alert_text_color) = parsed_color;
                  } else {
                    id(ui_alert_text_color) = 0xFFFFFF;
                  }
                  id(ui_alert_text_color_set) = 1;

                  uint32_t seconds = 10;
                  if (duration_seconds >= 0)
                    seconds = static_cast<uint32_t>(duration_seconds > 3600 ? 3600 : duration_seconds);
                  id(ui_alert_until_ms) = seconds == 0 ? 0 : millis() + seconds * 1000UL;
              - if:
                  condition:
                    lambda: |-
                      return sound_enabled;
                  then:
                    - script.execute: ui_play_display_alert_sound
              - script.execute: ui_show_display_alert

    - action: show_snapshot_alert
      variables:
        image_url: string
        duration_seconds: int
        sound_enabled: bool
      then:
        - if:
            condition:
              lambda: |-
                return !AirDot::onboarding::setup_or_onboarding_active(
                    id(setup_ap_active), id(setup_portal_active), id(onboarding_ui_active));
            then:
              - script.stop: ui_snapshot_restore_display_bandwidth
              - lambda: |-
                  if (AirDot::snapshot_alert::request_running())
                    return;

                  id(display_panel).set_low_bandwidth_mode(true);
                  if (lv_screen_active() != nullptr)
                    lv_obj_invalidate(lv_screen_active());

                  id(ui_alert_active) = 0;
                  id(ui_alert_until_ms) = 0;
                  id(ui_alert_title).clear();
                  id(ui_alert_message).clear();
                  id(ui_alert_text_color) = 0;
                  id(ui_alert_text_color_set) = 0;
                  AirDot::snapshot_alert::clear_active_snapshot(id(modal_overlay_snapshot_container));
                  lv_obj_clear_flag(id(modal_overlay_content_stack), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(modal_overlay_layer), LV_OBJ_FLAG_HIDDEN);
                  const bool started = AirDot::snapshot_alert::start_snapshot_request(
                      image_url, duration_seconds, sound_enabled);
                  if (!started) {
                    id(display_panel).set_low_bandwidth_mode(false);
                    if (lv_screen_active() != nullptr)
                      lv_obj_invalidate(lv_screen_active());
                  }

    - action: clear_snapshot_alert
      then:
        - script.execute: ui_hide_display_alert

    - action: clear_display_alert
      then:
        - script.execute: ui_hide_display_alert

    - action: snooze_alarm
      variables:
        duration_minutes: int
      then:
        - lambda: |-
            const uint32_t snooze_ms =
              static_cast<uint32_t>(duration_minutes > 0 ? duration_minutes : 0) * 60UL * 1000UL;
            id(air_quality_hazard_sound_snooze_until_ms) = millis() + snooze_ms;
            id(air_quality_hazard_last_chirp_ms) = 0;
            id(hazard_alert_chirp).stop();
            if (id(ha_buzzer_active) != 1)
              id(alert_buzzer_pwm).turn_off();

mdns:
  id: home_assistant_mdns
