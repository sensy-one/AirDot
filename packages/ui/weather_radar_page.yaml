script:
  - id: ui_refresh_weather_radar_page
    mode: restart
    then:
      - lambda: |-
          AirDot::weather_radar::configure_weather_radar_location(
              id(outdoor_latitude), id(outdoor_longitude), id(outdoor_location_valid));
          lv_obj_set_style_bg_color(AirDot::lv_obj(id(weather_radar_page)),
              AirDot::display_background_color(), LV_PART_MAIN);
          AirDot::weather_radar::refresh_weather_radar_scope(
              id(weather_radar_scope), id(ui_font_small), id(ui_font_radar_progress), id(ui_font_radar_tag));
