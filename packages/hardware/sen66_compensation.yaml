globals:
  - id: sen66_pressure_hpa_sent
    type: int
    restore_value: false
    initial_value: "0"

  - id: sen66_applied_voc_learning_time_hours
    type: int
    restore_value: false
    initial_value: "0"
  - id: sen66_voc_state_saved
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sen66_measurement_running
    type: bool
    restore_value: false
    initial_value: "true"
  - id: sen66_tuning_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sen66_stop_ok
    type: bool
    restore_value: false
    initial_value: "true"
  - id: sen66_voc_state
    type: std::array<uint16_t, 4>
    restore_value: false
    initial_value: "{0, 0, 0, 0}"

script:
  - id: sen66_restart_measurement
    mode: restart
    then:
      - lambda: |-
          if (!id(sen66_stop_ok)) {
            id(sen66_measurement_running) = true;
            id(sen66_air_quality_sensor).start_poller();
            return;
          }
          id(sen66_measurement_running) = AirDot::sen66_retry("start measurement", 3, 200, [&]() {
            return AirDot::sen66_start_measurement(id(sen66_air_quality_sensor));
          });
          id(sen66_air_quality_sensor).start_poller();
      - if:
          condition:
            lambda: 'return !id(sen66_measurement_running);'
          then:
            - script.execute: sen66_recover_measurement

  - id: sen66_recover_measurement
    mode: single
    then:
      - repeat:
          count: 6
          then:
            - if:
                condition:
                  lambda: 'return !id(sen66_measurement_running);'
                then:
                  - delay: 10s
                  - lambda: |-
                      id(sen66_measurement_running) = AirDot::sen66_start_measurement(id(sen66_air_quality_sensor));
                      if (id(sen66_measurement_running))
                        ESP_LOGI("sen66", "Measurement restarted by recovery");
                      else
                        ESP_LOGW("sen66", "Recovery restart attempt failed");
      - if:
          condition:
            lambda: 'return !id(sen66_measurement_running);'
          then:
            - lambda: 'ESP_LOGE("sen66", "Could not restart SEN66 measurement; giving up recovery");'

  - id: sen66_apply_temperature_offset
    mode: single
    then:
      - lambda: |-
          AirDot::sen66_apply_temperature_offset(
            id(sen66_air_quality_sensor),
            AirDot::onboarding::load_sen66_temperature_offset_c(),
            ${sen66_temperature_offset_slope},
            ${sen66_temperature_offset_time_constant_s},
            ${sen66_temperature_offset_slot});

  - id: sen66_force_co2_calibration
    mode: single
    parameters:
      reference_ppm: int
    then:
      - lambda: |-
          id(sen66_air_quality_sensor).stop_poller();
          id(sen66_air_quality_sensor).cancel_timeout(1);
          AirDot::sen66_stop_measurement(id(sen66_air_quality_sensor));
      - delay: 1200ms
      - lambda: |-
          int bounded_reference = reference_ppm;
          if (bounded_reference < 400)
            bounded_reference = 400;
          if (bounded_reference > 2000)
            bounded_reference = 2000;

          int16_t correction_ppm = 0;
          AirDot::sen66_perform_forced_co2_recalibration(
              id(sen66_air_quality_sensor), static_cast<uint16_t>(bounded_reference), correction_ppm);
      - lambda: |-
          AirDot::sen66_start_measurement(id(sen66_air_quality_sensor));
          id(sen66_air_quality_sensor).start_poller();

  - id: sen66_apply_learning_times
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return id(sen66_applied_voc_learning_time_hours) != AirDot::onboarding::load_voc_learning_time_hours();
          then:
            - lambda: |-
                id(sen66_voc_state_saved) = id(sen66_applied_voc_learning_time_hours) != 0 &&
                    AirDot::sen66_get_voc_algorithm_state(id(sen66_air_quality_sensor), id(sen66_voc_state).data());
                id(sen66_air_quality_sensor).stop_poller();
                id(sen66_air_quality_sensor).cancel_timeout(1);
                id(sen66_stop_ok) = AirDot::sen66_retry("stop measurement", 3, 100, [&]() {
                  return AirDot::sen66_stop_measurement(id(sen66_air_quality_sensor));
                });
            - delay: 1500ms
            - lambda: |-
                id(sen66_tuning_ok) = false;
                if (!id(sen66_stop_ok)) {
                  ESP_LOGE("sen66", "Skipping VOC learning time update: sensor did not stop");
                  return;
                }
                const uint16_t voc_hours = AirDot::onboarding::load_voc_learning_time_hours();
                id(sen66_tuning_ok) = AirDot::sen66_retry("set VOC learning time", 3, 50, [&]() {
                  return AirDot::sen66_set_voc_learning_time(id(sen66_air_quality_sensor), voc_hours);
                });
            - delay: 50ms
            - lambda: |-
                if (id(sen66_stop_ok) && id(sen66_voc_state_saved)) {
                  AirDot::sen66_retry("restore VOC state", 3, 50, [&]() {
                    return AirDot::sen66_set_voc_algorithm_state(id(sen66_air_quality_sensor),
                                                                 id(sen66_voc_state).data());
                  });
                }
            - delay: 50ms
            - script.execute: sen66_restart_measurement
            - script.wait: sen66_restart_measurement
            - lambda: |-
                if (id(sen66_tuning_ok) && id(sen66_measurement_running))
                  id(sen66_applied_voc_learning_time_hours) = AirDot::onboarding::load_voc_learning_time_hours();
                else
                  ESP_LOGW("sen66", "VOC learning time not marked as applied; will retry");
