# Per-sensor history page. The background (glow, edge-to-edge 24 h area graph and line) is rendered by
# AirDot::SensorHistoryGraph into ${metric}_history_line; the labels sit on top of it.
id: ${metric}_history_page
bg_color: 0x000000
bg_opa: COVER
pad_all: 0
on_load:
  - lambda: |-
      AirDot::SensorHistoryGraph::render_for(id(${metric}_history_line));
widgets:
  - image:
      id: ${metric}_history_line
      src: snapshot_placeholder_image
      align: CENTER
      hidden: true

  - label:
      id: ${metric}_history_title_label
      align: TOP_MID
      y: 98
      text: "${title}"
      text_font: ui_font_small
      text_color: 0xFFFFFF
      text_opa: 60%
      text_letter_space: 2
      bg_opa: TRANSP

  - label:
      id: ${metric}_current_value_label
      align: CENTER
      y: -58
      text: "--"
      text_font: ui_font_history_value
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      long_mode: CLIP

  - label:
      id: ${metric}_unit_label
      align: CENTER
      y: -4
      text: "${unit}"
      text_font: ui_font_metric_unit
      text_color: 0xFFFFFF
      text_opa: 80%
      bg_opa: TRANSP

  - label:
      id: ${metric}_history_empty_label
      align: CENTER
      y: 100
      text: "--"
      text_font: ui_font_large
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      text_letter_space: 1

  - obj:
      align: BOTTOM_MID
      y: -56
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_main: CENTER
        flex_align_cross: CENTER
        pad_column: 22
      widgets:
        - label:
            id: ${metric}_history_max_label
            text: "--"
            text_font: ui_font_small
            text_color: 0xFFFFFF
            text_opa: 80%
            bg_opa: TRANSP
        - label:
            id: ${metric}_history_min_label
            text: "--"
            text_font: ui_font_small
            text_color: 0xFFFFFF
            text_opa: 80%
            bg_opa: TRANSP
