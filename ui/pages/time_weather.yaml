id: time_page
bg_color: 0x000000
bg_opa: COVER
pad_all: 0

widgets:
  - image:
      id: time_page_glow_image
      src: snapshot_placeholder_image
      align: CENTER
      hidden: true
  - arc:
      id: time_page_ring
      align: CENTER
      width: 448
      height: 448
      adjustable: false
      clickable: false
      rotation: 270
      start_angle: 215
      end_angle: 145
      min_value: 0
      max_value: 1
      value: 0
      pad_all: 0
      bg_opa: TRANSP
      border_width: 0
      arc_color: 0x20E840
      arc_opa: 45%
      arc_width: 3
      arc_rounded: true
      indicator:
        arc_opa: TRANSP
        arc_width: 0
        pad_all: 0
      knob:
        bg_opa: TRANSP
        border_width: 0
        shadow_width: 0
        pad_all: 0
  - obj:
      align: CENTER
      y: 156
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: CENTER
        flex_align_cross: CENTER
      widgets:
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
            widgets:
              - label:
                  id: time_page_connection_indicator_label
                  text: "●"
                  text_font: ui_font_small
                  text_color: 0xFF2B2B
                  bg_opa: TRANSP
                  translate_y: -2
              - label:
                  id: time_page_connection_label
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            pad_top: 6
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: END
            widgets:
              - label:
                  id: time_page_outdoor_temperature_label
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_letter_space: 1
              - label:
                  id: time_page_outdoor_temperature_unit_label
                  text: "°C"
                  text_font: ui_font_summary_unit
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  translate_x: -7
                  pad_right: 11
              - label:
                  id: time_page_outdoor_humidity_label
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_letter_space: 1
              - label:
                  id: time_page_outdoor_humidity_unit_label
                  text: "%"
                  text_font: ui_font_summary_unit
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  translate_x: -7
                  pad_right: 0
              - label:
                  id: time_page_outdoor_pressure_label
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_letter_space: 1
              - label:
                  id: time_page_outdoor_pressure_unit_label
                  text: "hPa"
                  text_font: ui_font_summary_unit
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  translate_x: -7
                  pad_left: 1
  - label:
      id: time_page_placeholder_label
      align: CENTER
      x: 0
      y: -16
      text: "-- : --"
      text_font: ui_font_status
      text_color: 0xFFFFFF
      bg_opa: TRANSP
  - obj:
      id: time_page_24h_group
      align: CENTER
      x: 0
      y: -16
      hidden: true
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_main: CENTER
        flex_align_cross: CENTER
        pad_column: 0
      widgets:
        - label:
            id: time_page_24h_hour_tens_label
            width: 62
            text: "0"
            text_font: ui_font_calm_time
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: CENTER
        - label:
            id: time_page_24h_hour_ones_label
            width: 62
            text: "0"
            text_font: ui_font_calm_time
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: CENTER
        - label:
            id: time_page_24h_colon_label
            width: 30
            text: ":"
            text_font: ui_font_calm_time
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: CENTER
            translate_y: -8
        - label:
            id: time_page_24h_minute_tens_label
            width: 62
            text: "0"
            text_font: ui_font_calm_time
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: CENTER
        - label:
            id: time_page_24h_minute_ones_label
            width: 62
            text: "0"
            text_font: ui_font_calm_time
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: CENTER
  - obj:
      id: time_page_12h_group
      align: CENTER
      x: 0
      y: -16
      hidden: true
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_main: CENTER
        flex_align_cross: START
        pad_column: 0
      widgets:
        - obj:
            width: 60
            height: 1
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 0
            widgets:
              - label:
                  id: time_page_12h_hour_tens_label
                  width: 62
                  text: "0"
                  text_font: ui_font_calm_time
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  long_mode: CLIP
                  text_align: CENTER
              - label:
                  id: time_page_12h_hour_ones_label
                  width: 62
                  text: "0"
                  text_font: ui_font_calm_time
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  long_mode: CLIP
                  text_align: CENTER
              - label:
                  id: time_page_12h_colon_label
                  width: 30
                  text: ":"
                  text_font: ui_font_calm_time
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  long_mode: CLIP
                  text_align: CENTER
                  translate_y: -8
              - label:
                  id: time_page_12h_minute_tens_label
                  width: 62
                  text: "0"
                  text_font: ui_font_calm_time
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  long_mode: CLIP
                  text_align: CENTER
              - label:
                  id: time_page_12h_minute_ones_label
                  width: 62
                  text: "0"
                  text_font: ui_font_calm_time
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  long_mode: CLIP
                  text_align: CENTER
        - label:
            id: time_page_suffix_label
            width: 60
            text: ""
            text_font: ui_font_time_suffix
            text_color: 0xFFFFFF
            bg_opa: TRANSP
            long_mode: CLIP
            text_align: LEFT
            pad_left: 8
            translate_y: 30
  - label:
      id: time_page_date_label
      align: CENTER
      x: 0
      y: -118
      width: 360
      text: "--"
      text_font: ui_font_action
      text_color: 0xFFFFFF
      bg_opa: TRANSP
      text_letter_space: 1
      long_mode: CLIP
      text_align: CENTER
  - obj:
      align: CENTER
      y: 84
      width: SIZE_CONTENT
      height: SIZE_CONTENT
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: CENTER
        flex_align_cross: CENTER
      widgets:
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
            widgets:
              - label:
                  id: time_page_weather_label
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_letter_space: 1
                  long_mode: CLIP
        - label:
            id: time_page_weather_high_low_label
            width: 340
