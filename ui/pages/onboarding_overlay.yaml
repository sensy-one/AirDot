widgets:
  - obj:
      id: modal_overlay_layer
      hidden: true
      align: CENTER
      width: 480
      height: 480
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
      pad_all: 0
      scrollbar_mode: "OFF"
      scrollable: false
      widgets:
        # Glow and countdown ring for messages sent from Home Assistant (see packages/ui/message_style.yaml).
        - image:
            id: modal_overlay_glow_image
            src: snapshot_placeholder_image
            align: CENTER
            hidden: true
        - arc:
            id: modal_overlay_countdown_arc
            hidden: true
            align: CENTER
            width: 448
            height: 448
            adjustable: false
            clickable: false
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 2000
            value: 2000
            pad_all: 0
            bg_opa: TRANSP
            border_width: 0
            arc_color: 0x2A2A2C
            arc_opa: COVER
            arc_width: 4
            indicator:
              arc_color: 0x40A6FF
              arc_opa: 90%
              arc_width: 4
              arc_rounded: true
            knob:
              bg_opa: TRANSP
              border_width: 0
              shadow_width: 0
              pad_all: 0
        - obj:
            id: modal_overlay_snapshot_container
            hidden: true
            align: CENTER
            width: 480
            height: 480
            bg_color: 0x000000
            bg_opa: COVER
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              - image:
                  id: modal_overlay_snapshot_image
                  src: snapshot_placeholder_image
                  align: CENTER
                  width: 480
                  height: 480
                  antialias: true

        - obj:
            id: modal_overlay_content_stack
            align: CENTER
            width: 380
            height: 480
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 24
            widgets:
              - label:
                  id: modal_overlay_title_label
                  width: 380
                  height: SIZE_CONTENT
                  text: "AirDot"
                  text_font: ui_font_modal_title
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_align: CENTER

              - label:
                  id: modal_overlay_body_label
                  width: 380
                  height: SIZE_CONTENT
                  text: "--"
                  text_font: ui_font_small
                  text_color: 0xFFFFFF
                  bg_opa: TRANSP
                  text_align: CENTER

              - obj:
                  id: modal_overlay_primary_button_group
                  width: 380
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 0
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_column: 0
                  widgets:
                    - label:
                        id: modal_overlay_primary_button_left_bracket_label
                        hidden: true
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        text: ""
                        text_font: ui_font_small
                        text_color: 0xFFFFFF
                        bg_opa: TRANSP
                    # Pill showing what a press of the device button does (styled in message_style.yaml).
                    - label:
                        id: modal_overlay_primary_button_label
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        text: "--"
                        text_font: ui_font_small
                        text_color: 0xFFFFFF
                        bg_color: 0xFFFFFF
                        bg_opa: 14%
                        border_color: 0xFFFFFF
                        border_width: 2
                        border_opa: 40%
                        radius: 100
                        pad_left: 30
                        pad_right: 30
                        pad_top: 9
                        pad_bottom: 11
                        text_align: CENTER
                    - label:
                        id: modal_overlay_primary_button_right_bracket_label
                        hidden: true
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        text: ""
                        text_font: ui_font_small
                        text_color: 0xFFFFFF
                        bg_opa: TRANSP

  # Screen ring: one segment in the bottom gap of the pollutant arcs (see includes/airdot/ui/screen_ring.h).
  - arc:
      id: screen_ring
      hidden: true
      align: CENTER
      width: 448
      height: 448
      adjustable: false
      clickable: false
      rotation: 270
      start_angle: 150
      end_angle: 210
      min_value: 0
      max_value: 1000
      value: 1000
      pad_all: 0
      arc_opa: TRANSP
      arc_width: 0
      bg_opa: TRANSP
      border_width: 0
      indicator:
        arc_color: 0x40A6FF
        arc_opa: 60%
        arc_width: 12
        arc_rounded: true
        pad_all: 0
      knob:
        bg_opa: TRANSP
        border_width: 0
        shadow_width: 0
        pad_all: 0
